x-cassandra: &cassandra
  image: cassandra:5
  environment:
    CASSANDRA_CLUSTER_NAME: sensorring
    CASSANDRA_SEEDS: cass1
    MAX_HEAP_SIZE: 512M
    HEAP_NEWSIZE: 128M
  healthcheck:
    test: [ "CMD", "cqlsh", "-e", "describe keyspaces" ]
    interval: 15s
    timeout: 10s
    retries: 20
    start_period: 60s

services:
  cass1:
    <<: *cassandra
    ports: [ "9042:9042" ]
  cass2:
    <<: *cassandra
    depends_on:
      cass1: { condition: service_healthy }
  cass3:
    <<: *cassandra
    depends_on:
      cass2: { condition: service_healthy }
